
name: Handle Jira Attachments

on:
  workflow_dispatch:
    inputs:
      issue_key:
        required: true
        type: string
      attachments:
        required: true
        type: string
      issuetype:
        required: true
        type: string
      external_key:
        required: false
        type: string

jobs:
  process:
    runs-on: ubuntu-24.04
    environment: automation

    steps:
      - name: Clone private repo manually
        env:
          PAT: ${{ secrets.PAT_READ_PRIVATE_REPO }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/suarabhj19/JSM-SNOW-Integration.git sample-app

      - name: Check Java 17
        shell: bash
        run: |
          set -e

          java -version

          if ! java -version 2>&1 | grep -q '"17\.'; then
            echo "ERROR: Java 17 is required."
            exit 1
          fi

          echo "Java 17 is available."

      - name: Install Groovy from Apache
        shell: bash
        run: |
          set -e

          GROOVY_VERSION="5.1.3"

          DOWNLOAD_URL="https://downloads.apache.org/groovy/${GROOVY_VERSION}/distribution/apache-groovy-binary-${GROOVY_VERSION}.zip"

          echo "Downloading Groovy ${GROOVY_VERSION}..."

          curl --fail --location \
            --retry 3 \
            --connect-timeout 20 \
            "$DOWNLOAD_URL" \
            --output "$RUNNER_TEMP/groovy.zip"

          mkdir -p "$RUNNER_TEMP/groovy-dist"

          unzip -q "$RUNNER_TEMP/groovy.zip" \
            -d "$RUNNER_TEMP/groovy-dist"

          GROOVY_BIN=$(find "$RUNNER_TEMP/groovy-dist" \
            -type f -path '*/bin/groovy' -print -quit)

          if [ -z "$GROOVY_BIN" ]; then
            echo "ERROR: Groovy executable not found."
            exit 1
          fi

          GROOVY_HOME="${GROOVY_BIN%/bin/groovy}"

          chmod +x "$GROOVY_HOME/bin/groovy"

          echo "$GROOVY_HOME/bin" >> "$GITHUB_PATH"

          echo "Groovy installation completed."

          "$GROOVY_BIN" --version

      - name: Run Groovy script
        run: groovy sample-app/scripts/process_latest_attachments.groovy
        env:
          INPUT_ISSUE_KEY: ${{ github.event.inputs.issue_key }}
          INPUT_ATTACHMENTS: ${{ github.event.inputs.attachments }}
          INPUT_ISSUETYPE: ${{ github.event.inputs.issuetype }}
          INPUT_EXTERNAL_KEY: ${{ github.event.inputs.external_key }}
          SERVICENOW_INCIDENT_URL: ${{ secrets.SERVICENOW_INCIDENT_URL }}
          SERVICENOW_REQUEST_URL: ${{ secrets.SERVICENOW_REQUEST_URL }}
          SERVICENOW_AUTH: ${{ secrets.SERVICENOW_AUTH }}
