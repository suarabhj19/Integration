
name: Handle Jira Issue

on:
  workflow_dispatch:
    inputs:
      issue_key:
        description: 'Jira Issue Key'
        required: true
        type: string

jobs:
  handle-issue:
    runs-on: ubuntu-24.04
    environment: automation
    timeout-minutes: 20

    steps:

      # Step 1: Clone private integration repository
      - name: Clone private repo manually
        shell: bash
        env:
          PAT: ${{ secrets.PAT_READ_PRIVATE_REPO }}
        run: |
          set -euo pipefail

          if [ -z "$PAT" ]; then
            echo "ERROR: PAT_READ_PRIVATE_REPO secret is missing."
            exit 1
          fi

          AUTH_HEADER=$(printf 'x-access-token:%s' "$PAT" | base64 -w0)

          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
            clone https://github.com/suarabhj19/JSM-SNOW-Integration.git sample-app

          unset AUTH_HEADER PAT

          echo "Private integration repository cloned."

      # Step 2: Verify Java 17
      - name: Check Java 17
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Java installation..."

          java -version

          JAVA_VERSION=$(java -version 2>&1 | head -n 1)

          if ! echo "$JAVA_VERSION" | grep -q '"17\.'; then
            echo "ERROR: Java 17 is required."
            exit 1
          fi

          echo "Java 17 is available."

      # Step 3: Download and install Groovy
      - name: Install Groovy from Apache
        shell: bash
        run: |
          set -euo pipefail

          GROOVY_VERSION="5.1.3"

          DOWNLOAD_URL="https://downloads.apache.org/groovy/${GROOVY_VERSION}/distribution/apache-groovy-binary-${GROOVY_VERSION}.zip"

          echo "Downloading Groovy ${GROOVY_VERSION}..."

          curl --fail --location \
            --retry 3 \
            --connect-timeout 20 \
            "$DOWNLOAD_URL" \
            --output "$RUNNER_TEMP/groovy.zip"

          echo "Extracting Groovy..."

          mkdir -p "$RUNNER_TEMP/groovy-dist"

          unzip -q "$RUNNER_TEMP/groovy.zip" \
            -d "$RUNNER_TEMP/groovy-dist"

          GROOVY_BIN=$(find "$RUNNER_TEMP/groovy-dist" \
            -type f -path '*/bin/groovy' -print -quit)

          if [ -z "$GROOVY_BIN" ]; then
            echo "ERROR: Groovy executable not found."
            exit 1
          fi

          GROOVY_HOME="${GROOVY_BIN%/bin/groovy}"

          echo "Setting executable permissions..."

          chmod +x "$GROOVY_HOME/bin/groovy"

          echo "GROOVY_HOME=$GROOVY_HOME" >> "$GITHUB_ENV"
          echo "$GROOVY_HOME/bin" >> "$GITHUB_PATH"

          echo "Verifying Groovy installation..."

          "$GROOVY_HOME/bin/groovy" --version

          echo "Groovy installation completed."

      # Step 4: Create Jira issue payload
      - name: Create payload.json
        shell: bash
        env:
          ISSUE_KEY: ${{ github.event.inputs.issue_key }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re

          issue_key = os.environ["ISSUE_KEY"].strip()

          if not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]*-\d+", issue_key):
              raise SystemExit("ERROR: Invalid Jira issue key.")

          with open("payload.json", "w") as f:
              json.dump(
                  {"issue_key": issue_key},
                  f,
                  indent=2
              )

          print("Jira issue payload created successfully.")
          PY

      # Step 5: Verify required integration files
      - name: Verify integration files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required files..."

          if [ ! -f "payload.json" ]; then
            echo "ERROR: payload.json not found."
            exit 1
          fi

          if [ ! -f "sample-app/scripts/handle_issue.groovy" ]; then
            echo "ERROR: handle_issue.groovy not found."
            exit 1
          fi

          if [ ! -x "$GROOVY_HOME/bin/groovy" ]; then
            echo "ERROR: Groovy is not executable."
            exit 1
          fi

          echo "All required files are available."

      # Step 6: Run Jira to ServiceNow integration
      - name: Run Groovy Script
        shell: bash
        env:
          JIRA_AUTH: ${{ secrets.JIRA_AUTH }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          SERVICENOW_INCIDENT_URL: ${{ secrets.SERVICENOW_INCIDENT_URL }}
          SERVICENOW_REQUEST_URL: ${{ secrets.SERVICENOW_REQUEST_URL }}
          SERVICENOW_AUTH: ${{ secrets.SERVICENOW_AUTH }}
        run: |
          set -euo pipefail

          echo "Starting Jira to ServiceNow integration..."

          "$GROOVY_HOME/bin/groovy" \
            sample-app/scripts/handle_issue.groovy \
            "$(pwd)/payload.json"

          echo "Jira to ServiceNow integration completed successfully."
